# Filing through the API or `gh issue create`? Forms only apply on the web:
# write the body with each field's label below as a `### ` heading, in order.
name: Module or feature
description: A Waybar module or state the style should color, or a new Waybar release to support.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The style sets colors and spacing. Fonts and modules stay in your own config.
  - type: input
    id: what
    attributes:
      label: Modules or states
      placeholder: "#battery.charging, #privacy, #custom-…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Waybar version that added them
      description: A link to the release notes or the module's man page helps.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What looks off without them, and which spec colors you think they should use.
    validations:
      required: true
