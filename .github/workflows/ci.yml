name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # themes/ and examples/ must match the generator, src/ and the current mistpine spec.
    # Waybar 0.9.24 and 0.15 (in Docker) must load the style and show the spec colors.
    uses: mistpine/port-kit/.github/workflows/port.yml@v0.1.0
    with:
      verify: true
